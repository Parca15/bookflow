spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

jwt:
  secret: Ym9va2Zsb3dTZWNyZXRLZXlGb3JKd3RUb2tlbjIwMjQh
  expiration: 86400000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
