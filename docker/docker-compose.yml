services:
  postgres:
    image: postgres:17
    container_name: bookflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookflow
      POSTGRES_USER: bookflow
      POSTGRES_PASSWORD: bookflow123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bookflow-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookflow
      SPRING_DATASOURCE_USERNAME: bookflow
      SPRING_DATASOURCE_PASSWORD: bookflow123
      JWT_SECRET: ${JWT_SECRET:-bookflowSecretKeyForJwtTokenGeneration2024BookFlowSystemManagement}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3001,http://localhost:5173}
      SPRING_PROFILES_ACTIVE: dev
      SPRING_FLYWAY_REPAIR_ON_MIGRATE: "true"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8081}
    container_name: bookflow-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
